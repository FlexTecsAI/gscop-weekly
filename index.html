<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GSCOP weekly records</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #14221f;
      --muted: #5c6f6b;
      --line: #d7e3df;
      --paper: #f3f7f5;
      --card: #ffffff;
      --teal: #0f6e6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Iowan Old Style", Palatino, Georgia, serif;
      color: var(--ink);
      background: var(--paper);
    }
    header.site {
      background: var(--teal);
      color: white;
      padding: 2.5rem 1.5rem 2rem;
    }
    header.site p { color: #d7ece9; }
    main { max-width: 880px; margin: 0 auto; padding: 1.5rem; }
    h1 { font-weight: 600; font-size: 2rem; margin: 0.2rem 0; }
    h2 { font-size: 1.45rem; margin: 0; }
    .mark { letter-spacing: 0.14em; text-transform: uppercase; font-family: "Avenir Next", "Segoe UI", sans-serif; font-size: 0.78rem; margin: 0; }
    article {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.25rem 1.35rem 1.1rem;
      margin-bottom: 1rem;
    }
    dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.8rem 1rem; margin: 1rem 0; }
    dt { font-family: "Avenir Next", "Segoe UI", sans-serif; font-size: 0.75rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
    dd { margin: 0.15rem 0 0; font-size: 1.25rem; }
    h3 { font-family: "Avenir Next", "Segoe UI", sans-serif; font-size: 0.85rem; margin: 0.6rem 0 0.3rem; color: var(--muted); font-weight: 600; }
    .note, .updated, .empty { color: var(--muted); font-family: "Avenir Next", "Segoe UI", sans-serif; font-size: 0.92rem; }
  </style>
</head>
<body>
  <header class="site">
    <p class="mark">FlexTecs</p>
    <h1>GSCOP weekly records</h1>
    <p>Each finished week, on this page.</p>
  </header>
  <main>
    <article>
      <h2>11/8 – 11/14</h2>
      <dl><div><dt>Emails scored</dt><dd>881</dd></div><div><dt>Flagged</dt><dd>358</dd></div><div><dt>Flagged ratio</dt><dd>40.6%</dd></div><div><dt>Threshold</dt><dd>0.01235166285187</dd></div></dl>
      <h3>Prior week 2026-11-01</h3><p class="note">No GSCOP Yes emails to measure.</p>
      
      <p class="updated">Updated 2026-11-21</p>
    </article>
    <p class="updated">Built 2026-11-21 04:41 UTC.</p>
  </main>
</body>
</html>
